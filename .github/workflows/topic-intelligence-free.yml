name: Free WeChat Topic Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content_os/free_topic_scan.py"
      - "content_os/build_editorial_shortlist.py"
      - "content_os/editorial_intelligence.py"
      - "content_os/source_health.py"
      - "content_os/source_registry.json"
      - "content_os/public_rankings.py"
      - "content_os/tests/test_free_topic_scan.py"
      - "content_os/tests/test_public_rankings.py"
      - ".github/workflows/topic-intelligence-free.yml"
  schedule:
    # 06:10 Asia/Shanghai. This is a research archive only.
    - cron: "10 22 * * *"
    # 06:50 Asia/Shanghai: free recovery scan when the first run is delayed.
    - cron: "50 22 * * *"
    # 07:30 and 07:55 China-time backup windows before the 08:20 writing task.
    # GitHub scheduled jobs are best-effort, not guaranteed to start on time.
    - cron: "30 23 * * *"
    - cron: "55 23 * * *"

permissions:
  contents: write

concurrency:
  group: free-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify free topic parsers
        run: |
          python -m unittest discover -s content_os/tests -p test_free_topic_scan.py -v
          python -m unittest discover -s content_os/tests -p test_public_rankings.py -v
      - name: Read-only topic and image discovery
        run: python content_os/free_topic_scan.py --profile all --images
      - name: Audit configured primary and fallback sources
        run: python content_os/source_health.py
      - name: Build advisory editorial shortlist from actual scan and archive history
        run: python content_os/build_editorial_shortlist.py
      - name: Commit private research artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-os-topic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reapply immutable generated outputs on top of the latest remote;
          # simple 'pull --rebase' often conflicts with another scheduled run.
          mkdir -p /tmp/content-os-research
          cp -a content_os/topic-intelligence/. /tmp/content-os-research/
          mkdir -p /tmp/content-os-editorial
          cp -a content_os/editorial-intelligence/. /tmp/content-os-editorial/
          mkdir -p /tmp/content-os-source-health
          cp -a content_os/source-health/. /tmp/content-os-source-health/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p content_os/topic-intelligence
            cp -a /tmp/content-os-research/. content_os/topic-intelligence/
            mkdir -p content_os/editorial-intelligence
            cp -a /tmp/content-os-editorial/. content_os/editorial-intelligence/
            mkdir -p content_os/source-health
            cp -a /tmp/content-os-source-health/. content_os/source-health/
            git add content_os/topic-intelligence content_os/editorial-intelligence content_os/source-health
            if git diff --cached --quiet; then
              echo "No research changes."
              exit 0
            fi
            git commit -m "research: update free WeChat topic discovery"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to persist research after retries"
          exit 1
