name: Jingyun Existing Draft Verify

on:
  push:
    branches: [main]
    paths:
      - "jingyun/verify_existing_draft.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3" "PySocks>=1.7,<2"
      - name: Verify current Jingyun draft
        env:
          WECHAT_APP_ID: ${{ secrets.JINGYUN_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.JINGYUN_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python jingyun/verify_existing_draft.py
