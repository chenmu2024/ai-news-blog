name: WeChat Metrics Collector

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to collect (YYYY-MM-DD)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect WeChat metrics
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python wechat/collect_metrics.py --date "${{ github.event.inputs.date }}"
          else
            echo "Metrics collection is manual-only because the account lacks analytics API permission."
            exit 0
          fi
