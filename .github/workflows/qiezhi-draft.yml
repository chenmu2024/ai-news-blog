name: Qiezhi WeChat Draft Bridge

on:
  push:
    branches: [main]
    paths:
      - "qiezhi/archive/*.md"
  workflow_dispatch:

concurrency:
  group: qiezhi-wechat-draft
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-qiezhi-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest archived article
        shell: bash
        run: |
          LATEST="$(find qiezhi/archive -maxdepth 1 -type f -name '*.md' | sort | tail -n 1)"
          if [ -z "$LATEST" ]; then
            echo "No archived Qiezhi article found."
            exit 1
          fi
          echo "ARTICLE_PATH=$LATEST" >> "$GITHUB_ENV"
          echo "[ARTICLE_PATH] $LATEST"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Content OS quality gate
        run: |
          python content_os/quality_gate.py \
            --article "$ARTICLE_PATH" \
            --profile qiezhi \
            --json-out qiezhi/status/quality-gate.json


      - name: Global visual requirement gate
        run: |
          python content_os/visual_gate.py \
            --article "$ARTICLE_PATH" \
            --profile qiezhi \
            --json-out qiezhi/status/visual-gate.json

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install dependencies
        run: pip install -r qiezhi/requirements.txt

      - name: Render Qiezhi cards and create WeChat draft
        env:
          WECHAT_APP_ID: ${{ secrets.QIEZHI_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.QIEZHI_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WECHAT_AUTHOR: "且知"
          STATUS_PATH: "qiezhi/status/latest.json"
        run: python qiezhi/publish_draft.py

      - name: Sync today article and success status
        shell: bash
        run: |
          cp "$ARTICLE_PATH" qiezhi/articles/today.md
          git config user.name "qiezhi-draft-bot"
          git config user.email "qiezhi-draft-bot@users.noreply.github.com"
          git add qiezhi/articles/today.md qiezhi/status/latest.json qiezhi/status/quality-gate.json qiezhi/status/visual-gate.json
          if git diff --cached --quiet; then
            echo "No article/status change."
          else
            git commit -m "Sync latest Qiezhi article and draft status"
            git pull --rebase origin main
            git push
          fi
