name: Zizhi Tongjian WeChat Draft Bridge

on:
  push:
    branches: [main]
    paths:
      - "zizhitongjian/archive/*.md"
  workflow_dispatch:

concurrency:
  group: zizhitongjian-wechat-draft
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-zizhitongjian-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest archived article
        shell: bash
        run: |
          LATEST="$(find zizhitongjian/archive -maxdepth 1 -type f -name '*.md' | sort | tail -n 1)"
          if [ -z "$LATEST" ]; then
            echo "No Zizhi Tongjian article found."
            exit 1
          fi
          echo "ARTICLE_PATH=$LATEST" >> "$GITHUB_ENV"
          echo "[ARTICLE_PATH] $LATEST"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r zizhitongjian/requirements.txt

      - name: Original-text source gate
        run: |
          python zizhitongjian/source_gate.py \
            --article "$ARTICLE_PATH" \
            --json-out zizhitongjian/status/source-gate.json

      - name: Content OS quality gate
        run: |
          python content_os/quality_gate.py \
            --article "$ARTICLE_PATH" \
            --profile zizhitongjian \
            --json-out zizhitongjian/status/quality-gate.json

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Create Zizhi Tongjian WeChat draft only
        env:
          WECHAT_APP_ID: ${{ secrets.TONGJIAN_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.TONGJIAN_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WECHAT_AUTHOR: "陈慕"
          ARTICLE_PATH: ${{ env.ARTICLE_PATH }}
        run: python zizhitongjian/publish_draft.py

      - name: Sync today article and success status
        shell: bash
        run: |
          mkdir -p zizhitongjian/articles zizhitongjian/status
          cp "$ARTICLE_PATH" zizhitongjian/articles/today.md
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ["ARTICLE_PATH"])
          raw = p.read_bytes()
          text = raw.decode("utf-8")
          title = next((x[2:].strip() for x in text.splitlines() if x.startswith("# ")), "")
          status = {
              "status": "success",
              "title": title,
              "article_path": str(p).replace("\\", "/"),
              "article_sha256": hashlib.sha256(raw).hexdigest(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "completed_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("zizhitongjian/status/latest.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "tongjian-draft-bot"
          git config user.email "tongjian-draft-bot@users.noreply.github.com"
          git add zizhitongjian/articles/today.md zizhitongjian/status/latest.json zizhitongjian/status/source-gate.json zizhitongjian/status/quality-gate.json
          if git diff --cached --quiet; then
            echo "No article/status change."
          else
            git commit -m "Sync latest Zizhi Tongjian article and draft status"
            git pull --rebase origin main
            git push
          fi
