name: Seven WeChat Draft Health Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content_os/daily_healthcheck.py"
      - "content_os/draft_preflight.py"
      - "content_os/gate_trace.py"
      - "content_os/publish_readiness.py"
      - "content_os/image_preflight.py"
      - "content_os/draft_journal.py"
      - "content_os/reconcile_confirmed.py"
      - "content_os/tests/test_reconcile_confirmed.py"
      - "content_os/tests/test_publish_readiness.py"
      - ".github/workflows/draft-health-audit.yml"
      - "content_os/tests/test_draft_*.py"
  schedule:
    # 10:15 and 13:15 Asia/Shanghai; independent of the 08:20 writing task.
    - cron: "15 2,5 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: content-os-daily-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test draft safety and audit logic
        run: |
          python -m unittest discover -s content_os/tests -p "test_draft_*.py" -v
          python -m unittest discover -s content_os/tests -p "test_publish_readiness.py" -v
          python -m unittest discover -s content_os/tests -p "test_reconcile_confirmed.py" -v
      - name: Audit all seven profiles without publishing
        run: python content_os/daily_healthcheck.py --output-dir content_os/daily-health
      - name: Persist daily health report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-os-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always recompute AFTER fetching main. Previously we copied an old
          # snapshot over a newly successful receipt, leaving latest.json stale.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Only a confirmed media_id PLUS the immutable PASS-gate snapshot
            # permits state repair. This script never calls WeChat draft/add.
            python content_os/reconcile_confirmed.py --root . > /tmp/content-os-reconcile.json
            python content_os/daily_healthcheck.py --output-dir content_os/daily-health > /tmp/content-os-rechecked.json
            git add -A -- content_os/daily-health qiezhi/status qiezhi/articles \
              wechat/status wechat/articles business/status business/articles \
              zizhitongjian/status zizhitongjian/articles parenting/status parenting/articles \
              jingyun/status jingyun/articles fashion/status fashion/articles
            if git diff --cached --quiet; then
              echo "No health changes."
              break
            fi
            git commit -m "ops: record seven-profile draft health"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Retry an unsent archive once (scheduled audits only)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const report = JSON.parse(fs.readFileSync('content_os/daily-health/latest.json','utf8'));
            const results = [];
            for (const [profile,item] of Object.entries(report.accounts)) {
              if (item.status === 'success') continue;
              if (!fs.existsSync(item.archive)) {
                results.push({profile,result:'missing_article',note:'No original article to retry'});
                continue;
              }
              let prev = {};
              try {prev = JSON.parse(fs.readFileSync(profile+'/status/latest.json','utf8'));} catch(_) {}
              // The separate durable journal is authoritative if GitHub
              // status syncing crashed after WeChat acknowledged draft/add.
              const journalPath = profile+'/status/draft-attempts/'+report.date+'.json';
              if (fs.existsSync(journalPath)) {
                let journal = {};
                try {journal = JSON.parse(fs.readFileSync(journalPath,'utf8'));} catch (_) {}
                results.push({profile,result:'draft_attempt_journal_present',
                  state:journal.state || 'unknown',
                  note:'Reconcile existing WeChat draft/media_id; never auto-retry'});
                continue;
              }
              const sameReceipt = prev.status === 'success' &&
                (prev.article_path === item.archive || (!prev.article_path && prev.title === item.title));
              // Already published but a local artifact changed: do not post a duplicate.
              if (sameReceipt) {
                results.push({profile,result:'manual_artifact_conflict',note:'Published receipt exists; never auto-republish'});
                continue;
              }
              const workflow_id = profile+'-draft.yml';
              let runs;
              try {
                const rsp = await github.rest.actions.listWorkflowRunsForWorkflow({owner,repo,workflow_id,per_page:30});
                runs = rsp.data.workflow_runs || [];
              } catch(e) {
                results.push({profile,result:'workflow_lookup_error',note:String(e.message||e)});
                continue;
              }
              const day = report.date;
              if (runs.some(r => ['queued','in_progress','waiting','requested','pending'].includes(r.status))) {
                results.push({profile,result:'already_running'});
                continue;
              }
              if (runs.some(r => r.event === 'workflow_dispatch' && r.created_at.slice(0,10) === day)) {
                results.push({profile,result:'retry_limit_reached'});
                continue;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id,ref:'main'});
                results.push({profile,result:'retry_requested',workflow_id});
              } catch(e) {
                results.push({profile,result:'retry_error',note:String(e.message||e)});
              }
            }
            core.info(JSON.stringify(results));
            await core.summary.addHeading('Content OS automatic safe retries')
              .addRaw(JSON.stringify(results,null,2)).write();
      - name: Fail visibly on scheduled audit when any draft or Gate is incomplete
        if: ${{ github.event_name == 'schedule' }}
        run: python content_os/daily_healthcheck.py --strict
# The push-triggered self-test is non-publishing; retry dispatch only runs on scheduled/manual audits.
