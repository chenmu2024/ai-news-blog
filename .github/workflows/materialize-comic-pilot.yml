name: Materialize Pilot Comic Art
on:
  push:
    branches: [main]
    paths:
      - 'content_os/asset-source/comic-pilot-20261014.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: materialize-20261014-comic
  cancel-in-progress: false
jobs:
  persist-verified-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Decode exact original image bytes, validate SHA-256 and JPEGs
        run: python content_os/materialize_comic_pilot.py
      - name: Commit only verified images
        run: |
          set -euo pipefail
          git config user.name "comic-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content_os/assets/ai-scenes/jingyun/2026-10-14 content_os/assets/ai-scenes/parenting/2026-10-14
          if git diff --cached --quiet; then
            echo "Already materialized"
            exit 0
          fi
          git commit -m "assets(comic): persist two 2026-10-14 pilots with original SHA"
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$ATTEMPT"
          done
          exit 1
