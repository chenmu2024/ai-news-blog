name: Comic Pilot Editorial Policy Fingerprints
on:
  push:
    branches: [main]
    paths: [".github/workflows/comic-pilot-fingerprints.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute current immutable-policy hashes
        run: |
          python - <<'PY'
          from content_os.editorial_review import policy_hash
          from pathlib import Path
          for name in ('jingyun','parenting'):
              print('POLICY_HASH',name,policy_hash(Path('.'),name))
          PY
