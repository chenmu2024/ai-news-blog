name: Recover Two Comic Pilot Draft Receipts (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/recover-two-comic-pilot-receipts.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recover-two-comic-pilot-receipts-20261014
  cancel-in-progress: false
jobs:
  readback-only-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}
      JINGYUN_WECHAT_APP_ID: ${{ secrets.JINGYUN_WECHAT_APP_ID }}
      JINGYUN_WECHAT_APP_SECRET: ${{ secrets.JINGYUN_WECHAT_APP_SECRET }}
      PARENTING_WECHAT_APP_ID: ${{ secrets.PARENTING_WECHAT_APP_ID }}
      PARENTING_WECHAT_APP_SECRET: ${{ secrets.PARENTING_WECHAT_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests[socks]>=2.32,<3'
      - name: Recover exact already confirmed drafts by draft/get ONLY
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from content_os.recover_readback import recover_one
          for profile in ('jingyun','parenting'):
              result=recover_one(Path('.'),profile,'2026-10-14--comic-pilot-01')
              print('READ_ONLY_RECOVERY',result)
              if result['result']!='recovered_verified_existing_draft' or result.get('image_count')!=6:
                  raise RuntimeError('Draft already exists, but exact readback still unavailable: '+str(result))
          PY
      - name: Create per-article immutable receipt from readback and confirmed journal
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          slug='2026-10-14--comic-pilot-01'
          for profile in ('jingyun','parenting'):
              article=Path(profile)/'archive'/(slug+'.md')
              journal=json.loads((Path(profile)/'status/draft-attempts'/(slug+'.json')).read_text('utf-8'))
              readback=json.loads((Path(profile)/'status/draft-readback'/(slug+'.json')).read_text('utf-8'))
              digest=hashlib.sha256(article.read_bytes()).hexdigest()
              if (journal.get('state')!='confirmed' or journal.get('article_sha256')!=digest or
                  journal.get('draft_media_id')!=readback.get('draft_media_id') or
                  readback.get('article_sha256')!=digest or readback.get('draft_get_verified') is not True or
                  readback.get('inline_image_count')!=6):
                  raise RuntimeError('Verified draft/get and exact saved journal differ for '+profile)
              dest=Path(profile)/'status/receipts'/(slug+'.json')
              if dest.exists():
                  existing=json.loads(dest.read_text('utf-8'))
                  if existing.get('draft_media_id')!=journal['draft_media_id'] or existing.get('article_sha256')!=digest:
                      raise RuntimeError('Prior receipt conflict: '+profile)
                  print('EXISTING_RECEIPT',profile)
                  continue
              dest.parent.mkdir(parents=True,exist_ok=True)
              item={'status':'success','profile':profile,'article_id':slug,'article_date':'2026-10-14',
                    'article_path':article.as_posix(),'article_sha256':digest,
                    'draft_media_id':journal['draft_media_id'],'inline_image_count':6,
                    'readback_verified':True,'recovered_without_draft_add':True,
                    'completed_at_utc':datetime.now(timezone.utc).isoformat()}
              dest.write_text(json.dumps(item,ensure_ascii=False,indent=2)+'\n','utf-8')
              print('RECOVERED_RECEIPT',profile)
          PY
      - name: Persist verified records only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "comic-readback-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- jingyun/status/draft-readback jingyun/status/receipts parenting/status/draft-readback parenting/status/receipts
          if git diff --cached --quiet; then
            echo "Both records already persisted"
            exit 0
          fi
          git commit -m "receipt(comics): save two existing verified WeChat drafts without retry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Only Git receipt sync failed; do NOT retry the WeChat API"
          exit 1
