name: Seven WeChat Draft Health Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content_os/daily_healthcheck.py"
      - "content_os/draft_preflight.py"
      - ".github/workflows/draft-health-audit.yml"
  schedule:
    # 10:15 and 13:15 Asia/Shanghai; independent of the 08:20 writing task.
    - cron: "15 2,5 * * *"

permissions:
  contents: write

concurrency:
  group: content-os-daily-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test draft safety and audit logic
        run: python -m unittest discover -s content_os/tests -p "test_draft_*.py" -v
      - name: Audit all seven profiles without publishing
        run: python content_os/daily_healthcheck.py --output-dir content_os/daily-health
      - name: Persist daily health report
        shell: bash
        run: |
          git config user.name "content-os-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_os/daily-health
          if ! git diff --cached --quiet; then
            git commit -m "ops: record seven-profile draft health"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Fail visibly when any draft or Gate is incomplete
        run: python content_os/daily_healthcheck.py --strict
