name: Content OS Verified Candidate Promotion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content_os/inbox/**"
      - "content_os/editorial-reviews/**"
      - "content_os/editorial_review.py"
      - "content_os/PRODUCTION_BRIEF.md"
      - "content_os/editorial-feedback.json"
      - "content_os/asset-staging/**"
      - "content_os/ingest_ai_assets.py"
      - "content_os/inbox_promote.py"
      - "content_os/prearchive_validate.py"
      - "content_os/tests/test_inbox_promote.py"
      - "content_os/safe_dispatch.py"
      - "content_os/tests/test_safe_dispatch.py"
      - ".github/workflows/content-os-inbox-promote.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: content-os-verified-candidate-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free checker dependencies
        run: pip install 'requests>=2.32,<3' 'pillow>=11,<13' 'markdown>=3.7,<4' 'PySocks>=1.7,<2'
      - name: Ingest generated AI image bytes from verified private staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-os-candidate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python content_os/ingest_ai_assets.py
            git add -A -- content_os/
            if git diff --cached --quiet; then
              echo "[AI_ASSETS] No newly verified images"
              break
            fi
            git commit -m "assets: materialize SHA-verified AI scene images"
            if git push origin HEAD:main; then
              echo "[AI_ASSETS] Persisted generated binary assets"
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "::error::Could not persist generated AI image bytes"
              exit 1
            fi
            sleep "$ATTEMPT"
          done
      - name: Validate promotion safety tests
        run: python -m unittest content_os.tests.test_inbox_promote content_os.tests.test_safe_dispatch -v
      - name: Verify each account and create new archive only after all gates PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-os-candidate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(python -c 'from datetime import datetime;from zoneinfo import ZoneInfo;print(datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat())')"
          for PROFILE in qiezhi wechat business zizhitongjian parenting jingyun fashion; do
            echo "::group::${PROFILE}"
            for ATTEMPT in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              OUTPUT="$(mktemp)"
              if ! python content_os/inbox_promote.py --profile "$PROFILE" --date "$DATE" > "$OUTPUT" 2>&1; then
                tail -c 2500 "$OUTPUT"
                echo "::warning::${PROFILE} candidate rejected before archive; no draft requested."
                rm -f "$OUTPUT"
                break
              fi
              tail -c 1000 "$OUTPUT"
              rm -f "$OUTPUT"
              FILE="${PROFILE}/archive/${DATE}.md"
              LEDGER="content_os/title-decisions/${DATE}.json"
              if [ ! -f "$FILE" ] || git ls-tree -r --name-only HEAD -- "$FILE" | grep -Fxq "$FILE"; then
                echo "[SKIP] ${PROFILE} no new approved candidate"
                break
              fi
              git add -- "$FILE" "$LEDGER"
              if git diff --cached --quiet; then break; fi
              git commit -m "content(${PROFILE}): promote verified ${DATE} archive"
              if git push origin HEAD:main; then
                echo "[PROMOTED] ${PROFILE}"
                break
              fi
              if [ "$ATTEMPT" -eq 3 ]; then
                echo "::error::Could not persist validated ${PROFILE} archive"
                exit 1
              fi
              sleep "$ATTEMPT"
            done
            echo "::endgroup::"
          done

          # Additional user-approved articles have independent IDs/journals and
          # may coexist with the first daily draft; never replace YYYY-MM-DD.md.
          for PROFILE in qiezhi wechat business zizhitongjian parenting jingyun fashion; do
            while IFS= read -r SOURCE; do
              ID="$(basename "$SOURCE" .md)"
              echo "::group::extra-$PROFILE-$ID"
              for ATTEMPT in 1 2 3; do
                git fetch origin main
                git reset --hard origin/main
                OUTPUT="$(mktemp)"
                if ! python content_os/inbox_promote.py --profile "$PROFILE" --date "$DATE" --article-id "$ID" > "$OUTPUT" 2>&1; then
                  tail -c 2500 "$OUTPUT"
                  echo "::warning::extra candidate $PROFILE/$ID rejected; no WeChat call."
                  rm -f "$OUTPUT"
                  break
                fi
                tail -c 1000 "$OUTPUT"
                rm -f "$OUTPUT"
                FILE="$PROFILE/archive/$ID.md"
                LEDGER="content_os/title-decisions/$ID.json"
                if ! test -f "$FILE" || git ls-tree -r --name-only HEAD -- "$FILE" | grep -Fxq "$FILE"; then
                  echo "[SKIP] No new supplementary article $FILE"
                  break
                fi
                git add -- "$FILE" "$LEDGER"
                git commit -m "content($PROFILE): promote approved extra $ID archive"
                if git push origin HEAD:main; then
                  echo "[PROMOTED EXTRA] $FILE"
                  break
                fi
                if [ "$ATTEMPT" -eq 3 ]; then
                  echo "::error::Could not persist extra archive $FILE"
                  exit 1
                fi
                sleep "$ATTEMPT"
              done
              echo "::endgroup::"
            done < <(find "content_os/inbox/$PROFILE" -maxdepth 1 -type f -name "$DATE--*.md" | sort)

          done

      - name: Dispatch first safe WeChat draft workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          DATE="$(python -c 'from datetime import datetime;from zoneinfo import ZoneInfo;print(datetime.now(ZoneInfo("Asia/Shanghai")).date())')"
          for PROFILE in qiezhi wechat business zizhitongjian parenting jingyun fashion; do
            # GITHUB_TOKEN push never triggers downstream workflow-on-push.
            # Each dispatch is guarded against existing daily Actions/journals.
            python content_os/safe_dispatch.py --profile "$PROFILE" --date "$DATE"
          done
          # Each extra draft is dispatched independently; old daily workflows
          # remain once-per-day and only guard YYYY-MM-DD.md.
          for PROFILE in qiezhi wechat business zizhitongjian parenting jingyun fashion; do
            while IFS= read -r FILE; do
              ID="$(basename "$FILE" .md)"
              JOURNAL="$PROFILE/status/draft-attempts/$ID.json"
              if [ -f "$JOURNAL" ]; then
                echo "[SKIP] $FILE has already attempted draft/add"
                continue
              fi
              echo "[EXTRA_DISPATCH] $PROFILE $FILE"
              gh workflow run multi-draft-bridge.yml --ref main -f profile="$PROFILE" -f article_path="$FILE"
            done < <(find "$PROFILE/archive" -maxdepth 1 -type f -name "$DATE--*.md" | sort)
          done

