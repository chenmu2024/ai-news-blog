name: User Authorized Jingyun AI-image Redraft

on:
  push:
    branches: [main]
    paths:
      - "content_os/redrafts/jingyun/2026-10-12.md"
      - "content_os/assets/ai-scenes/jingyun/2026-10-12/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-authorized-jingyun-ai-redraft-2026-10-12
  cancel-in-progress: false

jobs:
  create-redraft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r jingyun/requirements.txt
      - name: Install Chinese fonts
        timeout-minutes: 5
        run: |
          if ! fc-list :lang=zh family | grep -Eiq 'Noto Sans CJK|Noto Serif CJK|Source Han Sans'; then
            timeout 90s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
            timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Verify exact AI source asset provenance and hash
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          article=Path("content_os/redrafts/jingyun/2026-10-12.md")
          md=article.read_text("utf-8")
          m=re.search(r"<!--\s*AI_SCENE\s*(\{[^<>]*\})\s*-->",md,re.S)
          assert m,"AI_SCENE missing"
          d=json.loads(m.group(1))
          assert d["generator"]=="openai_image_gen" and d["generation_id"]
          assert d["rights"]=="ai_created_owned" and d["synthetic"] is True
          prefix="https://raw.githubusercontent.com/chenmu2024/ai-news-blog/main/"
          assert d["image_url"].startswith(prefix)
          asset=Path(d["image_url"][len(prefix):])
          assert asset.is_file(),asset
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==d["sha256"]
          from PIL import Image
          with Image.open(asset) as im:
              im.verify()
          print("[AI_SOURCE] PASS",asset,d["generation_id"])
          PY
      - name: Validate article and inline image
        run: |
          python content_os/publish_readiness.py --profile jingyun --article content_os/redrafts/jingyun/2026-10-12.md --date 2026-10-12
          python content_os/quality_gate.py --profile jingyun --article content_os/redrafts/jingyun/2026-10-12.md
          python content_os/visual_gate.py --profile jingyun --article content_os/redrafts/jingyun/2026-10-12.md
          python content_os/image_preflight.py --profile jingyun --article content_os/redrafts/jingyun/2026-10-12.md
      - name: Create one new authorized WeChat draft with inline AI image
        env:
          CONTENT_OS_USER_AUTHORIZED_REDRAFT: "1"
          AUTHORIZED_REDRAFT_ID: "2026-10-12-jingyun-ai-image-v1"
          CONTENT_OS_GITHUB_TOKEN: ${{ github.token }}
          WECHAT_APP_ID: ${{ secrets.JINGYUN_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.JINGYUN_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WECHAT_AUTHOR: "静筠"
          ARTICLE_PATH: "content_os/redrafts/jingyun/2026-10-12.md"
        run: python content_os/authorized_redraft_jingyun.py
