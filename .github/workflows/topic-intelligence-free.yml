name: Free WeChat Topic Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content_os/free_topic_scan.py"
      - ".github/workflows/topic-intelligence-free.yml"
  schedule:
    # 06:10 Asia/Shanghai. This is a research archive only.
    - cron: "10 22 * * *"

permissions:
  contents: write

concurrency:
  group: free-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only topic and image discovery
        run: python content_os/free_topic_scan.py --profile all --images
      - name: Commit private research artifacts
        run: |
          git config user.name "content-os-topic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_os/topic-intelligence
          if ! git diff --cached --quiet; then
            git commit -m "research: update free WeChat topic discovery"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
