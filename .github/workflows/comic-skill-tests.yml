name: Comic Skill Structural Regression
on:
  push:
    branches: [main]
    paths:
      - 'skills/wechat-comic-content-os/**'
      - 'content_os/comic_gate.py'
      - 'content_os/tests/test_comic_gate.py'
      - 'content_os/publish_readiness.py'
      - 'content_os/visual_gate.py'
      - 'content_os/image_resilience.py'
      - '.github/workflows/comic-skill-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-comic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free image utilities
        run: python -m pip install 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Syntax checks
        run: python -m compileall -q content_os/comic_gate.py content_os/publish_readiness.py content_os/visual_gate.py content_os/image_resilience.py
      - name: Comic and backward compatibility regression
        run: python -m unittest -v content_os.tests.test_comic_gate content_os.tests.test_ai_scene_policy content_os.tests.test_publish_readiness
