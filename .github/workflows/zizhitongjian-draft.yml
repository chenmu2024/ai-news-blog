name: Zizhi Tongjian WeChat Draft Bridge

on:
  push:
    branches: [main]
    paths:
      - "zizhitongjian/archive/*.md"
  workflow_dispatch:

concurrency:
  group: zizhitongjian-wechat-draft
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  create-zizhitongjian-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest archived article
        shell: bash
        run: |
          LATEST="$(find zizhitongjian/archive -maxdepth 1 -type f -name '*.md' | sort | tail -n 1)"
          if [ -z "$LATEST" ]; then
            echo "No Zizhi Tongjian article found."
            exit 1
          fi
          echo "ARTICLE_PATH=$LATEST" >> "$GITHUB_ENV"
          echo "[ARTICLE_PATH] $LATEST"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r zizhitongjian/requirements.txt

      - name: Original-text source gate
        run: |
          python zizhitongjian/source_gate.py \
            --article "$ARTICLE_PATH" \
            --json-out zizhitongjian/status/source-gate.json

      - name: Content OS quality gate
        run: |
          python content_os/quality_gate.py \
            --article "$ARTICLE_PATH" \
            --profile zizhitongjian \
            --json-out zizhitongjian/status/quality-gate.json


      - name: Global visual requirement gate
        run: |
          python content_os/visual_gate.py \
            --article "$ARTICLE_PATH" \
            --profile zizhitongjian \
            --json-out zizhitongjian/status/visual-gate.json

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Create Zizhi Tongjian WeChat draft only
        env:
          WECHAT_APP_ID: ${{ secrets.TONGJIAN_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.TONGJIAN_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WECHAT_AUTHOR: "陈慕"
          ARTICLE_PATH: ${{ env.ARTICLE_PATH }}
        run: python zizhitongjian/publish_draft.py

      - name: Sync today article and success status
        shell: bash
        run: |
          mkdir -p zizhitongjian/articles zizhitongjian/status
          cp "$ARTICLE_PATH" zizhitongjian/articles/today.md
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ["ARTICLE_PATH"])
          raw = p.read_bytes()
          text = raw.decode("utf-8")
          title = next((x[2:].strip() for x in text.splitlines() if x.startswith("# ")), "")
          status = {
              "status": "success",
              "title": title,
              "article_path": str(p).replace("\\", "/"),
              "article_sha256": hashlib.sha256(raw).hexdigest(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "completed_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("zizhitongjian/status/latest.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "tongjian-draft-bot"
          git config user.email "tongjian-draft-bot@users.noreply.github.com"
          git add zizhitongjian/articles/today.md zizhitongjian/status/latest.json zizhitongjian/status/source-gate.json zizhitongjian/status/quality-gate.json zizhitongjian/status/visual-gate.json
          if git diff --cached --quiet; then
            echo "No article/status change."
          else
            git commit -m "Sync latest Zizhi Tongjian article and draft status"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Record failure diagnostics
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const path = 'zizhitongjian/status/last-failure.json';
            let jobs = [];
            let apiError = null;
            try {
              const resp = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: runId, per_page: 100});
              jobs = (resp.data.jobs || []).map(j => ({
                id: j.id, name: j.name, conclusion: j.conclusion,
                steps: (j.steps || []).filter(s => s.conclusion === 'failure').map(s => ({name:s.name,conclusion:s.conclusion}))
              }));
            } catch (e) {apiError = String(e.message || e);}
            const result = {status:'failure', profile:'zizhitongjian', date:new Date().toISOString().slice(0,10),
              workflow_run_id:String(runId), workflow_url:`https://github.com/${owner}/${repo}/actions/runs/${runId}`,
              article_path:process.env.ARTICLE_PATH || 'zizhitongjian/archive/2026-10-08.md', jobs, apiError,
              note:'Diagnostic metadata only; inspect workflow logs for actual traceback.'};
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              sha = old.data.sha;
            } catch (e) {if (e.status !== 404) core.warning(String(e));}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,
              message:'diagnostics(zizhitongjian): record failed draft workflow',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')
            });
        env:
          ARTICLE_PATH: ${{ env.ARTICLE_PATH }}
