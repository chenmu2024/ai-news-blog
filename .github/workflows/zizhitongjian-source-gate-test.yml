name: Zizhi Tongjian Source Gate Tests

on:
  push:
    branches: [main]
    paths:
      - "zizhitongjian/source_gate.py"
      - "zizhitongjian/publish_draft.py"
      - "zizhitongjian/tests/**"
      - "content_os/quality_gate.py"
      - ".github/workflows/zizhitongjian-draft.yml"
      - ".github/workflows/zizhitongjian-source-gate-test.yml"
  workflow_dispatch:

jobs:
  source-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install "requests>=2.32,<3"

      - name: Python syntax checks
        run: |
          python -m py_compile zizhitongjian/source_gate.py
          python -m py_compile zizhitongjian/publish_draft.py
          python -m py_compile content_os/quality_gate.py

      - name: Public copy sanitizer test
        env:
          WECHAT_APP_ID: test
          WECHAT_APP_SECRET: test
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("pub", "zizhitongjian/publish_draft.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          sample = """# 测试
<!-- ZZTJ_SOURCE
{"work":"资治通鉴"}
-->
正文最后一句。

---

**原典依据：《资治通鉴》卷十；原文据维基文库核对，并以 CText 复核。**

**图片来源：Wikimedia Commons；某政府网站。**
"""
          out = mod.strip_internal_notes(sample)
          forbidden = ["ZZTJ_SOURCE", "原典依据：", "图片来源：", "Wikimedia Commons", "CText"]
          bad = [x for x in forbidden if x in out]
          assert not bad, f"public metadata leaked: {bad}"
          assert out.strip().endswith("正文最后一句。")
          print("Public copy sanitizer PASS")
          PY

      - name: Valid source must PASS
        run: |
          python zizhitongjian/source_gate.py \
            --article zizhitongjian/tests/source-valid.md \
            --json-out /tmp/source-valid.json

      - name: Fabricated excerpt must FAIL
        shell: bash
        run: |
          set +e
          python zizhitongjian/source_gate.py \
            --article zizhitongjian/tests/source-invalid.md \
            --json-out /tmp/source-invalid.json
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "ERROR: fabricated excerpt unexpectedly passed Source Gate"
            exit 1
          fi
          echo "Fabricated excerpt correctly rejected."
