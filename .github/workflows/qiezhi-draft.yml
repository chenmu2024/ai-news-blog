name: Qiezhi WeChat Draft Bridge

on:
  push:
    branches: [main]
    paths:
      - "qiezhi/archive/????-??-??.md"
  workflow_dispatch:

concurrency:
  group: qiezhi-wechat-draft
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  create-qiezhi-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest archived article
        shell: bash
        run: |
          LATEST="$(find qiezhi/archive -maxdepth 1 -type f -name '????-??-??.md' | sort | tail -n 1)"
          if [ -z "$LATEST" ]; then
            echo "No archived Qiezhi article found."
            exit 1
          fi
          echo "ARTICLE_PATH=$LATEST" >> "$GITHUB_ENV"
          echo "[ARTICLE_PATH] $LATEST"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Draft idempotency preflight
        id: preflight
        shell: bash
        run: |
          python content_os/draft_preflight.py --today-only --profile qiezhi --article "$ARTICLE_PATH"
      - name: Publisher input contract (no WeChat calls)
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        run: python content_os/publish_readiness.py --profile qiezhi --article "$ARTICLE_PATH"

      - name: Content OS quality gate
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        run: |
          python content_os/quality_gate.py \
            --article "$ARTICLE_PATH" \
            --profile qiezhi \
            --json-out qiezhi/status/quality-gate.json


      - name: Global visual requirement gate
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        run: |
          python content_os/visual_gate.py \
            --article "$ARTICLE_PATH" \
            --profile qiezhi \
            --json-out qiezhi/status/visual-gate.json

      - name: Bind passed gates to immutable article SHA256
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        run: python content_os/gate_trace.py --profile qiezhi --article "$ARTICLE_PATH"

      - name: Install dependencies
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        run: pip install -r qiezhi/requirements.txt


      - name: Validate external image bytes before font setup
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        timeout-minutes: 5
        env:
          CONTENT_OS_IMAGE_CACHE_DIR: ${{ runner.temp }}/content-os-images-${{ github.run_id }}-${{ github.run_attempt }}
        run: python content_os/image_preflight.py --profile qiezhi --article "$ARTICLE_PATH"

      - name: Install Chinese fonts (bounded)
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if fc-list :lang=zh family | grep -Eiq 'Noto Sans CJK|Noto Serif CJK|Source Han Sans'; then
            echo "[FONTS] Existing CJK fonts found; skip apt."
          else
            timeout 90s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
            timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-list :lang=zh family | grep -Eiq 'Noto Sans CJK|Noto Serif CJK|Source Han Sans' || { echo "::error::Chinese fonts missing"; exit 1; }

      - name: Render Qiezhi cards and create WeChat draft
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        env:
          CONTENT_OS_GITHUB_TOKEN: ${{ github.token }}
          CONTENT_OS_IMAGE_CACHE_DIR: ${{ runner.temp }}/content-os-images-${{ github.run_id }}-${{ github.run_attempt }}
          CONTENT_OS_IMAGE_CACHE_READ: "1"
          WECHAT_APP_ID: ${{ secrets.QIEZHI_WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.QIEZHI_WECHAT_APP_SECRET }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WECHAT_AUTHOR: "且知"
          STATUS_PATH: "qiezhi/status/latest.json"
        run: python qiezhi/publish_draft.py

      - name: Sync today article and success status
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        shell: bash
        run: |
          cp "$ARTICLE_PATH" qiezhi/articles/today.md
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          article = Path(os.environ["ARTICLE_PATH"])
          receipt_path = Path("qiezhi/status/latest.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          checksum = hashlib.sha256(article.read_bytes()).hexdigest()
          if receipt.get("status") != "success" or receipt.get("article_sha256") != checksum:
              raise RuntimeError("Qiezhi receipt mismatch after draft creation")
          receipt["article_path"] = article.as_posix()
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "qiezhi-draft-bot"
          git config user.email "qiezhi-draft-bot@users.noreply.github.com"
          git add qiezhi/articles/today.md qiezhi/status/latest.json qiezhi/status/quality-gate.json qiezhi/status/visual-gate.json qiezhi/status/draft-readback
          if git diff --cached --quiet; then
            echo "No article/status change."
          else
            git commit -m "Sync latest Qiezhi article and draft status"
            for attempt in 1 2 3 4 5 6 7; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 7 ]; then
                echo "Push failed after 7 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Refresh daily health audit after confirmed draft
        if: ${{ steps.preflight.outputs.should_publish == 'true' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run draft-health-audit.yml --ref main

      - name: Record failed draft diagnostic
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const path = 'qiezhi/status/last-failure.json';
            const runId = context.runId;
            let jobs = [], readError = null;
            try {
              const result = await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:runId,per_page:100});
              jobs = (result.data.jobs||[]).map(j=>({id:j.id,name:j.name,conclusion:j.conclusion,
                failed_steps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name)}));
            } catch(e) { readError = String(e.message||e); }
            const audit = {status:'failure',date:new Date().toISOString().slice(0,10),
              profile:'qiezhi', article_path:'qiezhi/archive/',
              workflow_run_id:String(runId),url:`https://github.com/${owner}/${repo}/actions/runs/${runId}`,
              jobs,readError};
            for(let attempt=0;attempt<3;attempt++){
              let sha;
              try { sha = (await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha; }
              catch(e){if(e.status!==404) throw e;}
              try {
                await github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,branch:'main',
                  message:'diagnostics(qiezhi): persist failed draft run',
                  content:Buffer.from(JSON.stringify(audit,null,2)+'\n').toString('base64')});
                break;
              } catch(e){if(e.status!==409||attempt===2) throw e;}
            }
